<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            font-family: 'Poppins', sans-serif;
        }

        .blob {
            position: absolute;
            border-radius: 9999px;
            filter: blur(120px);
            opacity: .25;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }

    </style>

    <title>404 - Page Not Found | MyBlog</title>

</head>


<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-gray-100 min-h-screen overflow-hidden relative">


    <!-- Background Blobs -->

    <div class="blob w-96 h-96 bg-cyan-500 top-0 -left-24"></div>

    <div class="blob w-96 h-96 bg-purple-500 bottom-0 right-0"></div>


    <!-- Navbar -->

    <nav class="relative z-10 backdrop-blur-xl bg-white/10 border-b border-white/10">

        <div class="max-w-7xl mx-auto px-6">

            <div class="flex justify-between items-center h-16">

                <a href="/"
                   class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">

                    MyBlog

                </a>


                <a href="/"
                   class="text-gray-300 hover:text-cyan-400 transition">

                    Home

                </a>

            </div>

        </div>

    </nav>


    <!-- 404 Content -->

    <main class="relative z-10 min-h-[calc(100vh-65px)] flex items-center justify-center px-6">

        <div class="text-center max-w-2xl">


            <!-- 404 -->

            <div class="text-[9rem] md:text-[12rem] font-extrabold leading-none
                        bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500
                        bg-clip-text text-transparent">

                404

            </div>


            <!-- Heading -->

            <h1 class="text-3xl md:text-5xl font-bold mt-4">

                Page Not Found

            </h1>


            <!-- Description -->

            <p class="text-gray-400 text-lg mt-5 leading-8">

                Looks like this page has gone missing.
                The post or page you're looking for doesn't exist
                or may have been moved.

            </p>


            <!-- Buttons -->

            <div class="flex flex-col sm:flex-row justify-center gap-4 mt-10">


                <!-- Home -->

                <a href="/"
                   class="px-7 py-3 rounded-xl
                          bg-gradient-to-r from-cyan-500 to-blue-600
                          text-white font-semibold
                          hover:scale-105
                          transition-transform duration-200">

                    ← Back to Home

                </a>


                <!-- Posts -->

                <a href="/"
                   class="px-7 py-3 rounded-xl
                          bg-white/10
                          border border-white/10
                          text-gray-200 font-semibold
                          hover:border-cyan-400/50
                          hover:text-cyan-400
                          transition">

                    Explore Posts

                </a>

            </div>


            <!-- Small Message -->

            <p class="text-gray-600 text-sm mt-12">

                Error 404 • MyBlog

            </p>

        </div>

    </main>


</body>

</html>
