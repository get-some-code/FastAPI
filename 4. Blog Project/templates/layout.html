<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:'Poppins',sans-serif;
        }

        .blob{
            position:absolute;
            border-radius:9999px;
            filter:blur(120px);
            opacity:.25;
            animation:float 8s ease-in-out infinite;
        }

        @keyframes float{
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(-30px);}
        }
    </style>

    <title>
        {% if title %}
            Blog - {{ title }}
        {% else %}
            My Blog
        {% endif %}
    </title>

</head>

<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-gray-100 min-h-screen overflow-x-hidden relative">

    <!-- Background -->
    <div class="blob w-96 h-96 bg-cyan-500 top-0 -left-24"></div>
    <div class="blob w-96 h-96 bg-purple-500 bottom-0 right-0"></div>

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 backdrop-blur-xl bg-white/10 border-b border-white/10">

        <div class="max-w-7xl mx-auto px-6">

            <div class="flex justify-between items-center h-16">

                <a href="/" class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    MyBlog
                </a>

                <div class="hidden md:flex gap-8">

                    <a href="/" class="hover:text-cyan-400 transition">
                        Home
                    </a>

                    <a href="#" class="hover:text-cyan-400 transition">
                        Articles
                    </a>

                    <a href="#" class="hover:text-cyan-400 transition">
                        About
                    </a>

                    <a href="#" class="hover:text-cyan-400 transition">
                        Contact
                    </a>

                </div>

            </div>

        </div>

    </nav>

    <!-- Hero -->
    <section class="max-w-6xl mx-auto text-center px-6 pt-20">

        <h1 class="text-5xl md:text-6xl font-extrabold">

            Welcome to

            <span class="bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 bg-clip-text text-transparent">

                MyBlog

            </span>

        </h1>

        <p class="text-gray-400 mt-6 max-w-2xl mx-auto text-lg">
            Share your thoughts and explore articles built with FastAPI and Tailwind CSS.
        </p>

    </section>

    <!-- Main -->
    <main class="max-w-6xl mx-auto px-6 py-16">

        <div class="mb-10">

            <h2 class="text-4xl font-bold">
                Latest
                <span class="text-cyan-400">
                    Posts
                </span>
            </h2>

            <p class="text-gray-400 mt-2">
                Read the newest articles from our blog.
            </p>

        </div>

        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->

    <footer class="border-t border-white/10 mt-20">

        <div class="max-w-6xl mx-auto py-8 px-6 flex justify-between items-center flex-col md:flex-row">

            <p class="text-gray-400">
                © 2026 MyBlog
            </p>

            <div class="flex gap-6 mt-4 md:mt-0">

                <a href="#" class="hover:text-cyan-400">
                    GitHub
                </a>

                <a href="#" class="hover:text-cyan-400">
                    LinkedIn
                </a>

                <a href="#" class="hover:text-cyan-400">
                    Twitter
                </a>

            </div>

        </div>

    </footer>

</body>

</html>
