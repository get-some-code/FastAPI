{% extends "layout.html" %}

{% block content %}

<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

    {% for blog in posts %}

    <article
        class="bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl p-7 transition-all duration-300 hover:-translate-y-2 hover:border-cyan-400/40 hover:shadow-2xl hover:shadow-cyan-500/20">

        <h2 class="text-2xl font-bold text-cyan-400">
            <a href="http://127.0.0.1:8000/post/{{blog.id}}"> {{ blog.title }} </a>
        </h2>

        <p class="mt-2 text-gray-400">
            By
            <span class="text-white font-semibold">
                {{ blog.author.username }}
            </span>
        </p>

        <p class="mt-5 text-gray-300 leading-7">
            {{ blog.content }}
        </p>

    </article>

    {% else %}

    <div class="col-span-full text-center text-gray-400 py-10 text-xl">
        No blogs found.
    </div>

    {% endfor %}

</div>

{% endblock %}
